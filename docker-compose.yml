services:
  postgres:
    image: postgres:17-alpine
    container_name: tallyweb-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tallyweb
      POSTGRES_PASSWORD: tallyweb
      POSTGRES_DB: tallyweb
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tallyweb-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
